<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給最重要的你❤️</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}
body{
    overflow-x:hidden;
    background:linear-gradient(135deg,#ffd6e7,#ffeef6,#fff);
    min-height:100vh;
}
.heart{
    position:fixed;
    color:#ff7aa2;
    animation:fall linear infinite;
    user-select:none;
}
@keyframes fall{
    from{
        transform:translateY(-100px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}
.container{
    width:90%;
    max-width:900px;
    margin:auto;
    text-align:center;
    padding:70px 20px;
}
.card{
    background:white;
    border-radius:25px;
    padding:45px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}
h1{
    color:#ff4f84;
    font-size:45px;
    margin-bottom:20px;
}
h2{
    color:#ff6f9f;
    margin-top:35px;
}
p{
    color:#555;
    font-size:20px;
    line-height:2;
}
button{
    margin-top:35px;
    border:none;
    padding:18px 45px;
    border-radius:40px;
    background:#ff5f93;
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}
button:hover{
    transform:scale(1.08);
    background:#ff3c7d;
}
#letter{
    margin-top:35px;
    display:none;
    animation:fade 1s;
}
@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
.footer{
    margin-top:60px;
    color:#999;
}
.music{
    margin-top:20px;
}
</style>
</head>
<body>
<div id="hearts"></div>
<div class="container">
<div class="card">
<h1>❤️ 給志傑 ❤️</h1>
<p>
謝謝你出現在我的生命裡<br>
也謝謝你陪我經歷了好多好多事情
</p>
<h2>想對你說...</h2>
<p>
我們一起哭過、吵過、也努力和好過<br>
或許我們都不是完美的人<br>
但我希望未來的每一天<br>
我們都能一起變成更好的人
</p>
<button onclick="showLetter()">
點我打開信💌
</button>
<div id="letter">
<h2>💖 一封給你的信 💖</h2>
<p>
志傑寶寶<br><br>

謝謝你願意走進我的生命<br><br>
即使我們曾經有很多誤會、很多爭吵<br><br>
但我始終相信，真正重要的人
值得我們一起努力<br><br>
希望未來的日子裡
我們可以一起完成夢想、
一起變老、
一起肩並肩走下去❤️
<br><br>

如果哪一天我們又遇到了困難
希望我們都不要輕易放開彼此的手。<br><br>
因為我希望
未來站在我身邊的人
一直都是你❤️<br><br>
我愛你哦 (mua❤️
</p>
</div>
<div class="footer">
愛你的妤寶寶❤️
</div>
</div>
</div>
<script>
for(let i=0;i<40;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*25)+"px";
heart.style.animationDuration=(4+Math.random()*5)+"s";
heart.style.animationDelay=Math.random()*5+"s";
document.body.appendChild(heart);
}
function showLetter(){
document.getElementById("letter").style.display="block";
}
</script>
</body>
</html>
